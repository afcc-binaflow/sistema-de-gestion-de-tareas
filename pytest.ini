# Configuracion de la suite de tests.
#
# `pythonpath = .` es lo que permite que los tests importen los modulos del
# proyecto (`servidor`, `config`, `db`) sin instalar el proyecto como paquete y
# sin depender de desde que carpeta se invoque `pytest`. Sin esto, la unica
# forma de correr la suite seria `python -m pytest` parado en la raiz, y un
# README con ese truco es un README que alguien va a romper.
#
# `testpaths` evita que pytest colecte el venv o los scripts sueltos.

[pytest]
testpaths = tests
pythonpath = .
